name: CI & Staged Release to Spark Host

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Benchmark Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Run Golden Benchmark Gate
        run: |
          python tools/evaluate_openings.py --dir docs/validation/golden

      - name: Check Formatting & Git Cleanliness
        run: |
          git diff --check

  deploy:
    name: Staged Release to Spark Host
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH Key
        if: env.SPARK_SSH_KEY != ''
        env:
          SPARK_SSH_KEY: ${{ secrets.SPARK_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SPARK_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H spark-2079 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Spark Appliance
        if: env.SPARK_SSH_HOST != ''
        env:
          SPARK_SSH_HOST: ${{ secrets.SPARK_SSH_HOST }}
        run: |
          echo "Deploying update to Spark appliance at port 8090..."
          # rsync and invoke deploy/release.py
